<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 1284" width="904" height="1284" role="img" aria-labelledby="arch-title arch-desc" font-family="IBM Plex Sans, system-ui, sans-serif">
<title id="arch-title">TraceTriage pipeline architecture</title>
<desc id="arch-desc">Ten stages running top to bottom. A frozen SatNOGS snapshot feeds SGP4 physics, then four frozen splits. Two evidence channels run side by side, image processing into features and a bounded corridor fit into a calibrated image-only baseline arm. Both feed a small calibrated fusion head, then calibration with out-of-distribution detection and abstention, then the review-value queue. The queue feeds a Granite reviewer note and a read-only evidence agent, and both feed the static console. Every box names the module that implements it and the receipt it writes.</desc>
<rect width="904" height="1284" fill="#050d21"/>
