<text x="56" y="932" fill="#c3c4c7" font-size="11.5">disagreement reason codes, episode deduplication, concentration caps, and the lift over random at equal budget</text>
<title>pipeline/tracetriage/queue.py writes artifacts/QUEUE_RECEIPT.json</title>
<text x="56" y="976" fill="#888b90" font-size="10" font-family="IBM Plex Mono, ui-monospace, monospace">queue.py  →  QUEUE_RECEIPT.json</text>
