<rect x="40" y="772" width="824" height="96" fill="#1b2434" stroke="#313845" stroke-width="1"/>
<rect x="40" y="772" width="3" height="96" fill="#fca50a"/>
<text x="56" y="796" fill="#f1f2f3" font-size="14" font-weight="600">Calibration, OOD, abstention</text>
<text x="56" y="814" fill="#c3c4c7" font-size="11.5">the model declines rather than guessing, and the risk-coverage curve says what declining bought</text>
