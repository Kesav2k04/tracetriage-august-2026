<text x="468" y="442" fill="#f1f2f3" font-size="14" font-weight="600">Corridor fit</text>
<text x="468" y="460" fill="#c3c4c7" font-size="11.5">one bounded offset search per observation, scored against nulls</text>
<text x="468" y="475" fill="#c3c4c7" font-size="11.5">built from that observation's own Doppler values</text>
<title>pipeline/tracetriage/corridor_fit.py writes artifacts/GATE3_RECEIPT.json</title>
<text x="468" y="504" fill="#888b90" font-size="10" font-family="IBM Plex Mono, ui-monospace, monospace">corridor_fit.py  →  GATE3_RECEIPT.json</text>
</g>
