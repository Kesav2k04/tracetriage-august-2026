<text x="56" y="696" fill="#c3c4c7" font-size="11.5">small and calibrated, reported against the baseline on a chronological split with an interval</text>
<title>pipeline/tracetriage/fusion.py writes artifacts/FUSION_RECEIPT.json</title>
<text x="56" y="740" fill="#888b90" font-size="10" font-family="IBM Plex Mono, ui-monospace, monospace">fusion.py  →  FUSION_RECEIPT.json</text>
</g>
