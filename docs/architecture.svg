<text x="468" y="578" fill="#c3c4c7" font-size="11.5">image-only, calibrated, the control the physics arm has to beat</text>
<title>pipeline/tracetriage/baseline.py writes artifacts/BASELINE_RECEIPT.json</title>
<text x="468" y="622" fill="#888b90" font-size="10" font-family="IBM Plex Mono, ui-monospace, monospace">baseline.py  →  BASELINE_RECEIPT.json</text>
