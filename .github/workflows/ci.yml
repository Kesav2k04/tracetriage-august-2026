name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Here for the live-API job, which now runs daily instead of per commit. The other two
  # jobs run on this schedule as well, which costs one rebuild a day and buys notice of an
  # upstream dependency break before a commit finds it.
  schedule:
    - cron: "17 6 * * *"

# A superseded push has nothing left to say. Without this, three commits in ten minutes
# hold three runners and send two failure notifications about a tree that no longer exists,
# and the notification a reader learns to ignore is the one that mattered.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The judged path must work from a clean clone with the network disabled.
# This workflow is that claim, tested.
jobs:
  offline-replay:
    name: Clean clone, offline replay
    runs-on: ubuntu-latest
    # Every job here carries one. A step that wedges rather than fails holds a runner until
    # the six-hour default expires, and the run says nothing while it does.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. Several audit receipts name the commit they were produced at, and
          # a depth-1 clone holds only the tip, so the tests that check a receipt against
          # real history failed here and passed on every developer machine. Four of them:
          # SECRET_SCAN, ATTRIBUTION_AUDIT and REPO_WEIGHT all name 3a734031, the sign-off
          # names 4d380b48, and the clean-clone transcript names its own. Both commits exist;
          # the runner simply could not see them.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create pinned environment
        # --torch-backend=cpu resolves torch and torchvision against
        # https://download.pytorch.org/whl/cpu and leaves every other dependency on PyPI.
        # Without it the default Linux wheel arrives with about 2.5 GB of nvidia-* CUDA
        # packages, and this runner has no GPU: the rule for this project is that CI
        # measures on CPU, so that is download time for code which cannot execute here.
        # Which packages get installed is unchanged; only which torch wheel satisfies them.
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python --torch-backend=cpu -e ".[full,dev,onnx]"

      - name: Lint
        run: .venv/bin/python -m ruff check .

      - name: Type check
        run: .venv/bin/python -m mypy pipeline
        continue-on-error: true

      - name: Offline test suite
        # -m "not network" is the gate that proves the replay needs no external service.
        run: .venv/bin/python -m pytest -m "not network and not ocr and not llm" -q

      - name: Claim drift
        # Fails if a README or video number stops matching its generated receipt.
        run: .venv/bin/python -m pytest -m "not network and not ocr and not llm" -q tests/test_claim_drift.py

      - name: README results match the receipts
        # The results table is generated from the receipts. This is the check that the
        # committed table is what the current receipts produce, which nothing ran
        # before: the drift test beside it compares metric names, not values.
        run: .venv/bin/python scripts/sync_readme_results.py --check

      - name: The judges' page matches the receipts
        # FOR_JUDGES.md is the one file a judge is certain to read and the one nobody
        # re-derives, so it is generated. This fails on any hand edit to it, and on any
        # receipt that moved without the page being regenerated.
        run: .venv/bin/python scripts/sync_for_judges.py --check

      - name: Secret scan
        run: |
          if grep -rInE "(api[_-]?key|secret|password|token)[[:space:]]*=[[:space:]]*['\"][A-Za-z0-9_-]{16,}" \
             --include="*.py" --include="*.ts" --include="*.tsx" --include="*.json" \
             --exclude-dir=.venv --exclude-dir=node_modules . ; then
            echo "::error::possible secret committed"; exit 1
          fi
          echo "secret scan clean"

  network-recon:
    name: Live API contract (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    # Daily, or when someone asks. It reaches the public SatNOGS API, and running that on
    # every commit spends a stranger's rate limit re-answering a question that only changes
    # when upstream changes. It is also the job most likely to be red for a reason nobody
    # here can fix, which is how a whole workflow's output becomes background noise.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[full,dev]"
      - name: Tests that need the live SatNOGS API
        # Informational: an upstream API change should surface here, not silently
        # in a training run. It must never block the offline gate.
        run: .venv/bin/python -m pytest -m network -q

  console:
    name: Static console, typecheck build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install pinned dependencies
        working-directory: apps/web
        run: npm ci

      - name: Type check
        working-directory: apps/web
        run: npm run typecheck

      - name: Lint
        # Added on 2026-08-21, when this script ran for the first time. It had been in
        # package.json since the console was created and there was no eslint config of
        # any kind, so `npm run lint` printed a stack trace on every commit anyone tried
        # it on. Its first successful run found two errors and five warnings, including a
        # `no-img-element` suppression that was suppressing nothing because the directive
        # sat on the second line of its own comment. A check that is not in CI is a check
        # that stops working the week after it is written.
        working-directory: apps/web
        run: npm run lint

      - name: Unit tests
        # Vitest over the pure functions in apps/web/lib. Every coordinate defect this
        # console has had was arithmetic (the pole seam, the antimeridian unwrap, a
        # negative-elevation sample), and neither tsc nor next build can see a wrong
        # number. This is the check that can.
        working-directory: apps/web
        run: npm run test

      - name: Build
        # The export reads apps/web/public/data at module scope, so a broken page fails
        # here rather than degrading in the browser. Those files are committed, which is
        # why this job needs no snapshot and no Python.
        working-directory: apps/web
        run: npm run build
  presentation:
    name: Presentation film, typecheck claim tests and report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The film is the submission's presentation artifact and every number on screen is read
    # from a receipt at build time. Until this job existed the 453 claim checks and the
    # report generator ran only on one laptop, behind a `cd presentation` somebody had to
    # remember. The local gate has rows for both, and it omits them when node_modules is
    # absent, which is every clean clone. This is the job that makes the omission rare.
    #
    # The render itself is not here. `remotion render` downloads a headless Chromium and
    # takes 150 seconds a pass, and what it would establish is that a video file can be
    # produced from these sources. presentation/REPORT.md records three renders that agree
    # byte for byte, and the file they produced is committed, so the claim already has
    # evidence. What CI protects is the numbers, which is what these three steps check.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: presentation/package-lock.json

      - name: Install pinned dependencies
        working-directory: presentation
        run: npm ci

      - name: Type check
        # src, test, scripts and remotion.config.ts. The generator under scripts/ was
        # outside the project's include list when it was written, so nothing typechecked
        # the file that rewrites a table in a tracked document.
        working-directory: presentation
        run: npx tsc --noEmit

      - name: Claim tests
        # Every figure the film draws, against the receipt key path it came from, plus the
        # beat ordering and the spoken-duration bound.
        working-directory: presentation
        run: npm test

      - name: Report table matches src/data.ts
        # presentation/REPORT.md says its claim table is generated. This is the check that
        # it still is.
        working-directory: presentation
        run: npm run report -- --check
