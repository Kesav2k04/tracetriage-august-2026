name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The judged path must work from a clean clone with the network disabled.
# This workflow is that claim, tested.
jobs:
  offline-replay:
    name: Clean clone, offline replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Create pinned environment
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[full,dev,onnx]"

      - name: Lint
        run: .venv/bin/python -m ruff check .

      - name: Type check
        run: .venv/bin/python -m mypy pipeline
        continue-on-error: true

      - name: Offline test suite
        # -m "not network" is the gate that proves the replay needs no external service.
        run: .venv/bin/python -m pytest -m "not network and not ocr and not llm" -q

      - name: Claim drift
        # Fails if a README or video number stops matching its generated receipt.
        run: .venv/bin/python -m pytest -m "not network and not ocr and not llm" -q tests/test_claim_drift.py

      - name: README results match the receipts
        # The results table is generated from the receipts. This is the check that the
        # committed table is what the current receipts produce, which nothing ran
        # before: the drift test beside it compares metric names, not values.
        run: .venv/bin/python scripts/sync_readme_results.py --check

      - name: The judges' page matches the receipts
        # FOR_JUDGES.md is the one file a judge is certain to read and the one nobody
        # re-derives, so it is generated. This fails on any hand edit to it, and on any
        # receipt that moved without the page being regenerated.
        run: .venv/bin/python scripts/sync_for_judges.py --check

      - name: Secret scan
        run: |
          if grep -rInE "(api[_-]?key|secret|password|token)[[:space:]]*=[[:space:]]*['\"][A-Za-z0-9_-]{16,}" \
             --include="*.py" --include="*.ts" --include="*.tsx" --include="*.json" \
             --exclude-dir=.venv --exclude-dir=node_modules . ; then
            echo "::error::possible secret committed"; exit 1
          fi
          echo "secret scan clean"

  network-recon:
    name: Live API contract (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[full,dev]"
      - name: Tests that need the live SatNOGS API
        # Informational: an upstream API change should surface here, not silently
        # in a training run. It must never block the offline gate.
        run: .venv/bin/python -m pytest -m network -q

  console:
    name: Static console, typecheck build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install pinned dependencies
        working-directory: apps/web
        run: npm ci

      - name: Type check
        working-directory: apps/web
        run: npm run typecheck

      - name: Lint
        # Added on 2026-08-21, when this script ran for the first time. It had been in
        # package.json since the console was created and there was no eslint config of
        # any kind, so `npm run lint` printed a stack trace on every commit anyone tried
        # it on. Its first successful run found two errors and five warnings, including a
        # `no-img-element` suppression that was suppressing nothing because the directive
        # sat on the second line of its own comment. A check that is not in CI is a check
        # that stops working the week after it is written.
        working-directory: apps/web
        run: npm run lint

      - name: Unit tests
        # Vitest over the pure functions in apps/web/lib. Every coordinate defect this
        # console has had was arithmetic (the pole seam, the antimeridian unwrap, a
        # negative-elevation sample), and neither tsc nor next build can see a wrong
        # number. This is the check that can.
        working-directory: apps/web
        run: npm run test

      - name: Build
        # The export reads apps/web/public/data at module scope, so a broken page fails
        # here rather than degrading in the browser. Those files are committed, which is
        # why this job needs no snapshot and no Python.
        working-directory: apps/web
        run: npm run build
