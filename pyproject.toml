[project]
name = "tracetriage"
version = "0.1.0"
description = "Physics-conditioned, read-only review queue for public SatNOGS waterfall observations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Kesav2k04", email = "kesavk659@gmail.com" }]

dependencies = [
    # data plane
    "polars>=1.20",
    "pyarrow>=18.0",
    "numpy>=2.1",
    "scipy>=1.14",
    # imaging
    "pillow>=11.0",
    "opencv-python-headless>=4.10",
    # orbital physics
    "sgp4>=2.23",
    # modelling
    "torch>=2.5",
    "torchvision>=0.20",
    "scikit-learn>=1.5",
    "scikit-image>=0.24",
    # http + retries against the public SatNOGS API
    "httpx>=0.27",
    "tenacity>=9.0",
    # reporting
    "matplotlib>=3.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.112",
    "ruff>=0.8",
    "mypy>=1.13",
]
onnx = [
    "onnx>=1.17",
    "onnxruntime>=1.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/tracetriage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: test requires live network access (excluded from the offline replay gate)",
    "slow: long-running test",
    "acceptance: judged-path acceptance check",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
